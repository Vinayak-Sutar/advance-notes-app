<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Notes</title>
<style>
:root{color-scheme:light dark;--bg:#f6f5f1;--card:#fff;--text:#22211e;--muted:#6b6962;--line:#dcd9d0;--accent:#4f46b8;--on:#fff;--bad:#a93226}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--text:#ecebe6;--muted:#a3a198;--line:#34332f;--accent:#a5a0f0;--on:#17161f;--bad:#f0937f}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:380px;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:14px}
h1{margin:0 0 8px;font-size:21px;line-height:1.25}
p{margin:0 0 20px;color:var(--muted)}
label{display:block;margin-bottom:6px;font-size:14px;font-weight:600}
input,button{width:100%;min-height:48px;border-radius:10px;font:inherit}
input{padding:0 14px;margin-bottom:10px;background:transparent;color:inherit;border:1px solid var(--line);letter-spacing:.08em;text-transform:uppercase}
input::placeholder{color:var(--muted);opacity:.7}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{border:0;background:var(--accent);color:var(--on);font-weight:600;cursor:pointer}
#msg{margin:12px 0 0;color:var(--bad);font-size:14px}
#msg:empty{display:none}
</style>
</head>
<body>
<main>
  <h1>Connect this device to Notes</h1>
  <p>Your notes are locked to devices you've connected. Scan the QR code in the Notes window on your laptop.</p>
  <form action="/pair" method="get">
    <label for="code">Or type the code from that window</label>
    <input id="code" name="code" maxlength="9" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="K7M2-QX9P" required>
    <button type="submit">Connect</button>
  </form>
  <p id="msg" role="alert"></p>
</main>
<script>
var why = new URLSearchParams(location.search).get('pair');
document.getElementById('msg').textContent =
  why === 'wrong' ? "That code didn't match. The code changes each time Notes starts, so check the window on your laptop." :
  why === 'paused' ? 'Too many wrong codes. Try again in a few minutes.' : '';
</script>
</body>
</html>
